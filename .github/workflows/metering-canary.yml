name: Metering canary

permissions:
  contents: read

# Nightly ACTIVE liveness probe of the metering pipeline (plan-2607-06 /
# FOR-479): pay → unfreeze → register → seal → publish → chain → indexer →
# accrual, against the pinned canary instance on the target lane. This is
# deliberately NOT per-PR CI: safe-head lag (~6 min) plus indexer cadence
# make the honest end-to-end latency ~10-15 min by construction.
#
# The completeness/integrity counterpart is the ADR-0058 §7 reconciliation
# job (FOR-496); it cannot detect a silent pipeline, which is this canary's
# whole job.
#
# Alerting (plan-2608-02, FOR-518): the verdict goes to a Linear issue via the
# org `linear-health-alert` action. "Alerting v1 is this workflow failing" was
# not alerting — this canary was red from 2026-07-28 to 07-31 and was found by
# accident, while investigating an unrelated deploy failure. A canary nobody is
# told about is just a test that runs at night.

on:
  schedule:
    - cron: "17 3 * * *" # nightly, off the on-the-hour crowd
  workflow_dispatch:
    inputs:
      environment:
        description: "GitHub Environment for vars and secrets"
        required: true
        default: dev
        type: choice
        options:
          - dev

jobs:
  canary:
    name: Metering canary (${{ inputs.environment || 'dev' }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ inputs.environment || 'dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Run metering canary
        env:
          # The dev environment publishes the API as a bare FQDN (the
          # health-check derivation); CANOPY_BASE_URL wins when set.
          FORESTRIE_BASE_URL: ${{ vars.CANOPY_BASE_URL || format('https://{0}', vars.CANOPY_FQDN) }}
          X402_SETTLEMENT_URL: ${{ vars.X402_SETTLEMENT_URL }}
          CANOPY_OPS_ADMIN_TOKEN: ${{ secrets.CANOPY_OPS_ADMIN_TOKEN }}
          CANOPY_X402_DEV_PRIVATE_KEY: ${{ secrets.CANOPY_X402_DEV_PRIVATE_KEY }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          CANARY_INSTANCE_ID: ${{ vars.CANARY_INSTANCE_ID }}
          CANARY_LOG_ID: ${{ vars.CANARY_LOG_ID }}
          CANARY_GRANT_B64: ${{ vars.CANARY_GRANT_B64 }}
          CANARY_LOG_PEM: ${{ secrets.CANARY_LOG_PEM }}
          DELEGATION_COORDINATOR_URL: ${{ vars.DELEGATION_COORDINATOR_URL }}
          KNOWN_SEALER_KEY: ${{ vars.KNOWN_SEALER_KEY }}
        run: node scripts/metering-canary.mjs

      # Last, and always. A cancelled run is reported as failing on purpose: a
      # canary that could not finish has not proved the pipeline is alive, and
      # this workflow's only output is that proof.
      - name: Report canary health
        if: always()
        uses: forestrie/.github/actions/linear-health-alert@main
        with:
          alert_key: canopy-metering-canary
          state: ${{ job.status == 'success' && 'green' || 'failing' }}
          title: "Metering canary is red (${{ inputs.environment || 'dev' }})"
          labels: cicd
          linear_api_key: ${{ secrets.LINEAR_API_KEY }}
          body_md: |
            The metering canary failed on `${{ inputs.environment || 'dev' }}`.
            Job status: `${{ job.status }}`.

            It probes the whole metering pipeline against the pinned canary
            instance — pay → unfreeze → register → seal → publish → chain →
            indexer → accrual — so a failure means one of those links is dead,
            not that a test is flaky. On a traffic-less lane this canary is the
            only traffic, and reconciliation (FOR-496) cannot see a silent
            pipeline.

            Start with the step that failed in the run linked below. Common
            causes: the pinned canary account frozen for want of credits, the
            standing sealer delegation expired, or the indexer not advancing.

            This issue closes itself when the canary next passes.
