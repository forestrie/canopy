name: Release

# Tag push: deploy dev + system gate. Orchestrator dispatch (ADR-0043): same
# path from main with optional skip of cross-repo T3 when qualify-dev is green.
# Lane-b promotion is owned by the orchestrator promotion gate (ARC-0025).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      orchestrator_run_id:
        description: Correlation id from release-orchestrator release.yml
        required: true
        type: string
      skip_cross_repo_tests:
        description: Skip system-tests when orchestrator already qualified dev
        required: false
        default: true
        type: boolean

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      # Dogfood consumers (@canopy/api-e2e) import @forestrie/canopy-e2e-kit
      # from the workspace, so it has to be built before `pnpm -r test` can
      # resolve its entry point. ci.yml has done this all along; release.yaml
      # got away without it because the dispatch path defaults
      # skip_cross_repo_tests=true and filters that package out — and the
      # tag-push path, which runs the full suite, had NEVER EXECUTED. Every
      # prior tag was pushed by publish-github-release using GITHUB_TOKEN,
      # which triggers no workflow runs, so this branch sat as dead code
      # (29 workflow_dispatch runs, 0 push runs) until auto-tag cut v0.1.5 and
      # it failed on the first real attempt. FOR-532.
      - name: Build e2e-kit for dogfood consumers
        run: pnpm --filter @forestrie/canopy-e2e-kit build

      - name: Unit tests
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && \
             [ "${{ github.event.inputs.skip_cross_repo_tests }}" = "true" ]; then
            pnpm --filter '!@canopy/api-e2e' -r test
          else
            pnpm -r test
          fi

  deploy-dev:
    name: Deploy release to dev (Lane A)
    needs: unit-tests
    uses: ./.github/workflows/deploy-workers.yml
    secrets: inherit
    with:
      environment: dev
      run_e2e: false

  system-tests:
    name: System tests (dev gate)
    needs: deploy-dev
    if: >-
      github.event_name == 'push' ||
      github.event.inputs.skip_cross_repo_tests != 'true'
    uses: ./.github/workflows/tests-system.yml
    secrets: inherit
    with:
      environment: dev
      require_coordinator_e2e: true
      playwright_project: system
      ignore_deploy_path_overlap: true

  capture-release-fragment:
    # secret-egress-ok: exports only `release_tag`, a public version tag
    # It is read from the releases API; secrets.GITHUB_TOKEN authenticates that
    # query and never reaches an output. See devdocs plan-2608-04.
    name: Capture release fragment
    needs: [deploy-dev, system-tests]
    if: >-
      always() &&
      needs.deploy-dev.result == 'success' &&
      (needs.system-tests.result == 'success' ||
       needs.system-tests.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Resolve release metadata
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="${{ github.sha }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            latest=$(gh release list --repo "${{ github.repository }}" --limit 50 \
              --json tagName \
              -q '[.[] | select(.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+"))][0].tagName // empty')
            if [ -z "$latest" ]; then
              tag="v0.1.0"
            else
              base="${latest#v}"
              IFS=. read -r major minor patch <<< "${base%%-*}"
              patch=$((patch + 1))
              tag="v${major}.${minor}.${patch}"
            fi
          else
            tag="${{ github.ref_name }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Write release fragment
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          SHA: ${{ steps.meta.outputs.sha }}
          ORCH_RUN_ID: >-
            ${{ github.event_name == 'workflow_dispatch' &&
            github.event.inputs.orchestrator_run_id || github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p release-metadata
          jq -n \
            --arg repo "${{ github.repository }}" \
            --arg tag "$TAG" \
            --arg sha "$SHA" \
            --arg ref "${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref_name }}" \
            --arg orchestratorRunId "$ORCH_RUN_ID" \
            --arg capturedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              schemaVersion: 3,
              repo: $repo,
              ref: $ref,
              tag: $tag,
              sha: $sha,
              orchestratorRunId: $orchestratorRunId,
              capturedAt: $capturedAt,
              services: {
                canopy: { repo: "forestrie/canopy", ref: $sha }
              }
            }' > release-metadata/release-fragment.jsonc
          cat release-metadata/release-fragment.jsonc

      - name: Upload release fragment
        uses: actions/upload-artifact@v4
        with:
          name: release-fragment
          path: release-metadata/release-fragment.jsonc
          retention-days: 90
          if-no-files-found: error

  # FOR-532. This job used to be gated to `workflow_dispatch`. The frontier
  # resolver reads GitHub *Releases*, not git tags: `fetchLatestReleaseTag` and
  # `fetchSemverReleaseTags` both call `GET /repos/{owner}/{repo}/releases` and
  # match `tag_name`, and the kit pins come from the `components.jsonc` release
  # ASSET (release-orchestrator/packages/resolver/src/github-releases.ts). So
  # once auto-tag started cutting tags on merge (plan 2608-06 Phase 2) the tag
  # appeared, this workflow ran, and the frontier never advanced — no Release,
  # no components.jsonc, nothing for qualification to resolve. v0.1.5 was the
  # first canopy tag to land in that hole.
  #
  # It now runs on BOTH paths. The dispatch path is unchanged in behaviour and
  # goes away with plan 2608-06 Phase 3d.
  publish-github-release:
    name: Publish GitHub Release
    needs: capture-release-fragment
    # always() required: system-tests may skip on orchestrator dispatch; skip
    # propagates down the needs chain unless each downstream job opts in.
    if: >-
      always() &&
      needs.capture-release-fragment.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Dispatch cuts a new tag from main. A tag push must describe the TAGGED
      # tree — main may have moved on, and components.jsonc is read out of this
      # checkout, so taking main here would pin kit versions that are not the
      # ones this release contains.
      - uses: actions/checkout@v4
        with:
          ref: >-
            ${{ github.event_name == 'workflow_dispatch' && 'main'
            || github.ref_name }}
          fetch-depth: 0

      # Only the dispatch path mints a tag. On the tag-push path auto-tag
      # already did, and two cutters on one namespace is its own defect.
      - name: Create annotated tag (orchestrator dispatch only)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.capture-release-fragment.outputs.release_tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; skipping tag create"
          else
            git tag -a "$TAG" -m "Orchestrator release $TAG"
            git push origin "$TAG"
          fi

      - name: Publish GitHub Release with components.jsonc
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.capture-release-fragment.outputs.release_tag }}
          ORCH_RUN_ID: ${{ github.event.inputs.orchestrator_run_id }}
        run: |
          set -euo pipefail
          : "${TAG:?capture-release-fragment produced no release_tag}"
          KIT_VERSION=$(node -p "require('./packages/tests/e2e-kit/package.json').version")
          jq -n \
            --arg ecosystem "pnpm" \
            --arg pkg "@forestrie/canopy-e2e-kit" \
            --arg ver "$KIT_VERSION" \
            '{ ecosystem: $ecosystem, components: { ($pkg): $ver } }' \
            > components.jsonc
          cat components.jsonc
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            notes="Orchestrator-driven release (run ${ORCH_RUN_ID})."
          else
            notes="Released from tag ${TAG}, cut by auto-tag on merge to main."
          fi
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "${{ github.repository }}" components.jsonc --clobber
          else
            gh release create "$TAG" --repo "${{ github.repository }}" \
              --title "$TAG" \
              --notes "$notes" \
              components.jsonc
          fi
          # The assertion that catches the silence: read it back the way the
          # resolver will, rather than trusting the create. A Release that is
          # not listed, or is listed without its kit pins, is invisible to
          # qualification in exactly the way FOR-532 describes.
          got=$(gh api "/repos/${{ github.repository }}/releases?per_page=100" \
                  --jq "[.[] | select(.tag_name == \"${TAG}\")] | length")
          if [ "$got" != "1" ]; then
            echo "::error::Release ${TAG} is not listed by /releases (found ${got}) — the frontier resolver would not see this release" >&2
            exit 1
          fi
          if ! gh release view "$TAG" --repo "${{ github.repository }}" \
                 --json assets --jq '.assets[].name' | grep -qx 'components.jsonc'; then
            echo "::error::Release ${TAG} carries no components.jsonc asset — kit pins would be unresolvable" >&2
            exit 1
          fi
          echo "verified: ${TAG} is listed by /releases and carries components.jsonc"
