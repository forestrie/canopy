name: System tests

permissions:
  contents: read

# Canopy component e2e: the bootstrap suite (Playwright `system` project).
#
# The bootstrap suite always provisions its own ephemeral Univocity instances
# (FOR-531). There is no pinned-contract mode: a pinned address set
# `*_ALLOW_BOOTSTRAP=false`, which SKIPPED every bootstrap spec, so the pin
# bought nothing and cost all of the coverage.
#   Cross-repo lane specs live in forestrie/system-testing (the lane suite),
#   not here.
#
# Triggers: manual dispatch, workflow_call (deploy-workers, release), and
# push to main when deploy-workers did not run (non-overlapping paths).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "GitHub Environment for vars and secrets"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
      require_coordinator_e2e:
        description: "Fail if coordinator env vars missing and run coordinator project"
        required: false
        default: true
        type: boolean
      playwright_project:
        description: "prod = non-mutating prod project; system = full dev suite"
        required: false
        default: system
        type: choice
        options:
          - system
          - prod
      es256_address:
        description: "Optional ImutableUnivocity address (skip es256 provision)"
        required: false
        type: string
      ks256_address:
        description: "Optional ImutableUnivocity address (skip ks256 provision)"
        required: false
        type: string
      es256_bootstrap_pem_b64:
        description: "Base64 ES256 bootstrap PEM (required when es256_address set)"
        required: false
        type: string
      ks256_bootstrap_key_b64:
        description: "Base64 KS256 bootstrap private key (required when ks256_address set)"
        required: false
        type: string
      es256_genesis_log_id:
        description: "Optional ES256 genesis log id (derived from address when omitted)"
        required: false
        type: string
      ks256_genesis_log_id:
        description: "Optional KS256 genesis log id (derived from address when omitted)"
        required: false
        type: string

  workflow_call:
    inputs:
      ignore_deploy_path_overlap:
        description: |
          Run full suite when caller already deployed (reusable workflows inherit
          parent push events, so path dedupe must be bypassed).
        required: false
        type: boolean
        default: false
      environment:
        description: "GitHub Environment for vars and secrets"
        required: true
        type: string
      require_coordinator_e2e:
        description: "Fail if coordinator env vars missing and run coordinator project"
        required: false
        type: boolean
        default: false
      playwright_project:
        description: "prod = non-mutating prod project; system = full dev suite"
        required: false
        type: string
        default: system
      es256_address:
        required: false
        type: string
        default: ""
      ks256_address:
        required: false
        type: string
        default: ""
      es256_bootstrap_pem_b64:
        required: false
        type: string
        default: ""
      ks256_bootstrap_key_b64:
        required: false
        type: string
        default: ""
      es256_genesis_log_id:
        required: false
        type: string
        default: ""
      ks256_genesis_log_id:
        required: false
        type: string
        default: ""

  push:
    branches: [main]

jobs:
  paths:
    name: Path filter (deploy-workers overlap)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      deploy_workers: ${{ steps.filter.outputs.deploy_workers }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect deploy-workers-triggered paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            deploy_workers:
              - "packages/apps/canopy-api/**"
              - "packages/apps/delegation-coordinator/**"
              - "packages/apps/forestrie-ingress/**"
              - "packages/apps/x402-settlement/**"
              - "packages/shared/**"
              - "packages/merklelog/**"
              - "Taskfile.dist.yml"
              - "taskfiles/wrangler.yml"
              - ".github/workflows/deploy-workers.yml"

  bootstrap-univocity:
    # secret-egress-ok: the exported bootstrap keys are ephemeral, minted in-run
    # ci-prepare.sh generates them and they die with the run, so they are not
    # registered secrets and GitHub does not drop the outputs. No caller passes
    # the optional key inputs; secrets.DEPLOY_KEY never reaches an output.
    # See devdocs plan-2608-04.
    name: Provision ephemeral Univocity
    needs: [paths]
    if: |
      always() &&
      (
        github.event_name == 'workflow_dispatch' ||
        inputs.ignore_deploy_path_overlap == true ||
        (
          github.event_name == 'push' &&
          needs.paths.result == 'success' &&
          needs.paths.outputs.deploy_workers != 'true'
        )
      )
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'dev' || inputs.environment }}
    outputs:
      es256_address: ${{ steps.prepare.outputs.es256_address }}
      ks256_address: ${{ steps.prepare.outputs.ks256_address }}
      es256_log_id: ${{ steps.prepare.outputs.es256_log_id }}
      ks256_log_id: ${{ steps.prepare.outputs.ks256_log_id }}
      es256_bootstrap_pem_b64: ${{ steps.prepare.outputs.es256_bootstrap_pem_b64 }}
      ks256_bootstrap_signer: ${{ steps.prepare.outputs.ks256_bootstrap_signer }}
      ks256_bootstrap_key_b64: ${{ steps.prepare.outputs.ks256_bootstrap_key_b64 }}
      es256_fresh: ${{ steps.prepare.outputs.es256_fresh }}
      ks256_fresh: ${{ steps.prepare.outputs.ks256_fresh }}
    env:
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      E2E_UNIVOCITY_RPC_URL: ${{ vars.E2E_UNIVOCITY_RPC_URL }}
      INPUT_ES256_ADDRESS: ${{ inputs.es256_address || '' }}
      INPUT_KS256_ADDRESS: ${{ inputs.ks256_address || '' }}
      INPUT_ES256_PEM_B64: ${{ inputs.es256_bootstrap_pem_b64 || '' }}
      INPUT_KS256_KEY_B64: ${{ inputs.ks256_bootstrap_key_b64 || '' }}
      INPUT_ES256_LOG_ID: ${{ inputs.es256_genesis_log_id || '' }}
      INPUT_KS256_LOG_ID: ${{ inputs.ks256_genesis_log_id || '' }}
      PLAYWRIGHT_PROJECT: ${{ github.event_name == 'push' && 'system' || inputs.playwright_project || 'system' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Install go-task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: foundry-rs/foundry-toolchain@v1

      # No GitHub App token: this job fetches release assets from
      # forestrie/univocity (contract archive) and forestrie/univocity-tools
      # (deployer + contract-artefacts binaries), and BOTH REPOS ARE PUBLIC, so
      # the ambient GITHUB_TOKEN is sufficient.
      #
      # The app-token step that used to sit here could not work: `dev` carries
      # its own GITAPP_PRIVATE_KEY which shadows the repo-level secret and is not
      # a valid RSA key, so minting failed with "secretOrPrivateKey must be an
      # asymmetric key when using RS256". It went unnoticed because this job had
      # never run — it was gated on `e2e_tier == 't2'`, which nothing set.
      - name: Provision ephemeral bootstrap instances
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: task e2e-univocity:ci-prepare

  system-tests:
    name: System tests (${{ github.event_name == 'push' && 'dev' || inputs.environment }})
    needs: [bootstrap-univocity]
    # `always()` is load-bearing: `paths` is skipped on workflow_dispatch (it is
    # gated on the push event), and a skipped TRANSITIVE dependency otherwise
    # propagates a skip down the graph even though the direct need succeeded.
    # The pre-FOR-531 condition had it; dropping it silently skipped the suite
    # on dispatch while push runs still worked.
    if: always() && needs.bootstrap-univocity.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: ${{ github.event_name == 'push' && 'dev' || inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build e2e kit
        run: pnpm --filter @forestrie/canopy-e2e-kit build

      - name: Install go-task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: System API tests (Playwright)
        env:
          CANOPY_FQDN: ${{ vars.CANOPY_FQDN }}
          SCRAPI_API_KEY: ${{ secrets.SCRAPI_API_KEY }}
          CANOPY_BASE_URL: ${{ vars.CANOPY_BASE_URL }}
          FOREST_PROJECT_ID: ${{ vars.FOREST_PROJECT_ID }}
          CUSTODIAN_URL: ${{ vars.CUSTODIAN_URL }}
          CUSTODIAN_APP_TOKEN: ${{ secrets.CUSTODIAN_APP_TOKEN }}
          CUSTODIAN_BOOTSTRAP_APP_TOKEN: ${{ secrets.CUSTODIAN_BOOTSTRAP_APP_TOKEN }}
          CANOPY_OPS_ADMIN_TOKEN: ${{ secrets.CANOPY_OPS_ADMIN_TOKEN }}
          DELEGATION_COORDINATOR_URL: ${{ vars.DELEGATION_COORDINATOR_URL }}
          COORDINATOR_APP_TOKEN: ${{ secrets.COORDINATOR_APP_TOKEN }}
          UNIVOCITY_SERVICE_URL: ${{ vars.UNIVOCITY_SERVICE_URL }}
          E2E_UNIVOCITY_ADDRESS_KS256_BOOTSTRAP: ${{ needs.bootstrap-univocity.outputs.ks256_address }}
          E2E_UNIVOCITY_ADDRESS_ES256_BOOTSTRAP: ${{ needs.bootstrap-univocity.outputs.es256_address }}
          E2E_UNIVOCITY_RPC_URL: ${{ vars.E2E_UNIVOCITY_RPC_URL }}
          E2E_UNIVOCITY_CHAIN_ID: ${{ vars.E2E_UNIVOCITY_CHAIN_ID }}
          # x402 payer: defaults to the already-funded deployer EOA (DEPLOY_KEY
          # holds the lane's Base Sepolia USDC); a dedicated
          # CANOPY_X402_DEV_PRIVATE_KEY wins when set. X402_SETTLEMENT_URL
          # (optional) enables the settled-credits poll.
          #
          # No UNIVOCITY_CONTRACT_ADDRESS: it pinned a long-lived registered
          # instance for credits-purchase.spec.ts, was never set in any canopy
          # environment, and is retired with that spec (FOR-531).
          CANOPY_X402_DEV_PRIVATE_KEY: ${{ secrets.CANOPY_X402_DEV_PRIVATE_KEY || secrets.DEPLOY_KEY }}
          X402_SETTLEMENT_URL: ${{ vars.X402_SETTLEMENT_URL }}
          E2E_UNIVOCITY_GENESIS_LOG_ID_KS256: ${{ needs.bootstrap-univocity.outputs.ks256_log_id }}
          E2E_UNIVOCITY_GENESIS_LOG_ID_ES256: ${{ needs.bootstrap-univocity.outputs.es256_log_id }}
          # A PINNED PEM cannot travel through a job output — GitHub REDACTS
          # outputs containing secret values ("Skip output … since it may
          # contain secret"), so the secret is read directly here. The ephemeral
          # in-run PEM is not a registered secret and passes through.
          E2E_UNIVOCITY_ES256_BOOTSTRAP_PEM_B64: ${{ needs.bootstrap-univocity.outputs.es256_bootstrap_pem_b64 || inputs.es256_bootstrap_pem_b64 || secrets.E2E_UNIVOCITY_ES256_BOOTSTRAP_PEM_B64 || '' }}
          E2E_UNIVOCITY_KS256_BOOTSTRAP_SIGNER: ${{ needs.bootstrap-univocity.outputs.ks256_bootstrap_signer }}
          # Same redaction hazard as the ES256 PEM above.
          E2E_UNIVOCITY_KS256_BOOTSTRAP_KEY_B64: ${{ needs.bootstrap-univocity.outputs.ks256_bootstrap_key_b64 || inputs.ks256_bootstrap_key_b64 || secrets.E2E_UNIVOCITY_KS256_BOOTSTRAP_KEY_B64 || '' }}
          E2E_UNIVOCITY_ES256_ALLOW_BOOTSTRAP: ${{ needs.bootstrap-univocity.outputs.es256_fresh }}
          E2E_UNIVOCITY_KS256_ALLOW_BOOTSTRAP: ${{ needs.bootstrap-univocity.outputs.ks256_fresh }}
          # Run the BYOK checkpoint seal stretch on the dev lane: it is the
          # only automated guard on the live entry -> sealer -> v3 checkpoint
          # -> receipt path (~25s; caught two live regressions during the
          # FOR-316 cutover). All env it needs is exported above.
          E2E_BYOK_SEAL_STRETCH: ${{ (inputs.environment || 'dev') == 'dev' && '1' || '' }}
          PLAYWRIGHT_PROJECT: ${{ github.event_name == 'push' && 'system' || inputs.playwright_project || 'system' }}
          REQUIRE_COORDINATOR_E2E: ${{ github.event_name == 'push' && 'false' || inputs.require_coordinator_e2e || 'false' }}
        run: |
          set -euo pipefail
          trim_ws() { printf '%s' "$1" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'; }
          if [ -z "$(trim_ws "${SCRAPI_API_KEY:-}")" ]; then
            echo "::error::SCRAPI_API_KEY is not set in GitHub Environment **${{ inputs.environment || 'dev' }}**."
            exit 1
          fi
          BASE="$(trim_ws "${CANOPY_BASE_URL:-}")"
          if [ -n "$BASE" ]; then
            export CANOPY_BASE_URL="${BASE%/}"
          else
            FQ=$(trim_ws "${CANOPY_FQDN:-}")
            FQ="${FQ#https://}"
            FQ="${FQ#http://}"
            FQ="${FQ%%/*}"
            FQ="${FQ%/}"
            if [ -z "$FQ" ]; then
              echo "::error::Set **CANOPY_BASE_URL** or **CANOPY_FQDN** in GitHub Environment **${{ inputs.environment || 'dev' }}**."
              exit 1
            fi
            export CANOPY_BASE_URL="https://${FQ}"
            export CANOPY_BASE_URL="${CANOPY_BASE_URL%/}"
          fi
          PEM_B64="$(trim_ws "${E2E_UNIVOCITY_ES256_BOOTSTRAP_PEM_B64:-}")"
          if [ -n "$PEM_B64" ]; then
            PEM_FILE="${RUNNER_TEMP}/e2e-es256-bootstrap.pem"
            echo "$PEM_B64" | base64 -d > "$PEM_FILE"
            export E2E_UNIVOCITY_ES256_BOOTSTRAP_PEM_FILE="$PEM_FILE"
          fi
          KS256_SIGNER="$(trim_ws "${E2E_UNIVOCITY_KS256_BOOTSTRAP_SIGNER:-}")"
          if [ -n "$KS256_SIGNER" ]; then
            export E2E_UNIVOCITY_KS256_BOOTSTRAP_SIGNER="$KS256_SIGNER"
          fi
          KS256_KEY_B64="$(trim_ws "${E2E_UNIVOCITY_KS256_BOOTSTRAP_KEY_B64:-}")"
          if [ -n "$KS256_KEY_B64" ]; then
            KS256_KEY_FILE="${RUNNER_TEMP}/e2e-ks256-bootstrap.key"
            echo "$KS256_KEY_B64" | base64 -d > "$KS256_KEY_FILE"
            export E2E_UNIVOCITY_KS256_BOOTSTRAP_KEY_FILE="$KS256_KEY_FILE"
          fi
          export E2E_SKIP_UNIVOCITY_CHAIN_BINDING=false
          if [ "${PLAYWRIGHT_PROJECT}" = "prod" ]; then
            pnpm --filter @canopy/api-e2e exec playwright install chromium
            pnpm --filter @canopy/api-e2e exec playwright test \
              --project=prod \
              --forbid-only
          else
            OPS="$(trim_ws "${CANOPY_OPS_ADMIN_TOKEN:-}")"
            if [ -z "$OPS" ]; then
              echo "::error::CANOPY_OPS_ADMIN_TOKEN is required for bootstrap system e2e (onboard-token genesis)."
              exit 1
            fi
            COORD_URL="$(trim_ws "${DELEGATION_COORDINATOR_URL:-}")"
            COORD_TOKEN="$(trim_ws "${COORDINATOR_APP_TOKEN:-}")"
            task e2e-shared:validate-univocity-deploy
            pnpm --filter @canopy/api-e2e exec playwright install chromium
            pnpm --filter @canopy/api-e2e exec playwright test \
              --project=integration \
              --forbid-only
            pnpm --filter @canopy/api-e2e exec playwright test \
              --project=system \
              --forbid-only
            pnpm --filter @canopy/api-e2e exec playwright test \
              --project=custodian \
              --forbid-only
            if [ -n "$COORD_URL" ] && [ -n "$COORD_TOKEN" ]; then
              pnpm --filter @canopy/api-e2e exec playwright test \
                --project=coordinator \
                --forbid-only
            elif [ "${REQUIRE_COORDINATOR_E2E}" = "true" ]; then
              echo "::error::Coordinator e2e required but DELEGATION_COORDINATOR_URL or COORDINATOR_APP_TOKEN is unset."
              exit 1
            else
              echo "::warning::Skipping coordinator Playwright project."
            fi
          fi

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.event_name == 'push' && 'dev' || inputs.environment }}-${{ github.run_id }}
          path: packages/tests/canopy-api/playwright-report/
          retention-days: 14

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ github.event_name == 'push' && 'dev' || inputs.environment }}-${{ github.run_id }}
          path: packages/tests/canopy-api/test-results/
          retention-days: 14
          if-no-files-found: ignore
