name: System tests

permissions:
  contents: read

# Canopy component e2e: the bootstrap suite (Playwright `system` project).
#
# The bootstrap suite always provisions its own ephemeral Univocity contracts
# (FOR-531): a pool of them, one per forest the suite creates, because a
# contract accepts exactly one root forest. There is no pinned-contract mode:
# a pinned contract could serve only the first forest that used it.
#   Cross-repo lane specs live in forestrie/system-testing (the lane suite),
#   not here.
#
# Triggers: manual dispatch, workflow_call (deploy-workers, release), and
# push to main when deploy-workers did not run (non-overlapping paths).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "GitHub Environment for vars and secrets"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
      require_coordinator_e2e:
        description: "Fail if coordinator env vars missing and run coordinator project"
        required: false
        default: true
        type: boolean
      playwright_project:
        description: "prod = non-mutating prod project; system = full dev suite"
        required: false
        default: system
        type: choice
        options:
          - system
          - prod

  workflow_call:
    inputs:
      ignore_deploy_path_overlap:
        description: |
          Run full suite when caller already deployed (reusable workflows inherit
          parent push events, so path dedupe must be bypassed).
        required: false
        type: boolean
        default: false
      environment:
        description: "GitHub Environment for vars and secrets"
        required: true
        type: string
      require_coordinator_e2e:
        description: "Fail if coordinator env vars missing and run coordinator project"
        required: false
        type: boolean
        default: false
      playwright_project:
        description: "prod = non-mutating prod project; system = full dev suite"
        required: false
        type: string
        default: system

  push:
    branches: [main]
    # Documentation-only pushes cannot change what the bootstrap suite proves,
    # and since FOR-531 that suite deploys a contract pool and runs for ~6 minutes
    # on every qualifying push. Skip the ones that cannot affect it.
    #
    # `paths-ignore` skips only when EVERY changed file matches, so a push that
    # touches docs AND code still runs — the safe direction. Worker-path pushes
    # are filtered separately by the `paths` job below, because those chain
    # through deploy-workers.yml instead of being skipped outright.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".cursor/**"

jobs:
  paths:
    name: Path filter (deploy-workers overlap)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      deploy_workers: ${{ steps.filter.outputs.deploy_workers }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect deploy-workers-triggered paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            deploy_workers:
              - "packages/apps/canopy-api/**"
              - "packages/apps/delegation-coordinator/**"
              - "packages/apps/forestrie-ingress/**"
              - "packages/apps/x402-settlement/**"
              - "packages/shared/**"
              - "packages/merklelog/**"
              - "Taskfile.dist.yml"
              - "taskfiles/wrangler.yml"
              - ".github/workflows/deploy-workers.yml"

  system-tests:
    name: System tests (${{ github.event_name == 'push' && 'dev' || inputs.environment }})
    needs: [paths]
    # `always()` is load-bearing: `paths` is skipped on workflow_dispatch and
    # workflow_call (it is gated on the push event), and a skipped dependency
    # otherwise skips this job too.
    if: |
      always() &&
      (
        github.event_name == 'workflow_dispatch' ||
        inputs.ignore_deploy_path_overlap == true ||
        (
          github.event_name == 'push' &&
          needs.paths.result == 'success' &&
          needs.paths.outputs.deploy_workers != 'true'
        )
      )
    # Playwright cannot install chromium on ubuntu-26.04 (ubuntu-latest
    # since 2026-10-24); unpin once it supports it.
    runs-on: ubuntu-24.04
    # Each log a spec creates and then writes to waits up to 180 s to anchor
    # (e2e-kit retryWhileAuthorityPending); the suite does that about seven
    # times on top of a ~14 minute run.
    timeout-minutes: 60
    environment: ${{ github.event_name == 'push' && 'dev' || inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build e2e kit
        run: pnpm --filter @forestrie/canopy-e2e-kit build

      - name: Install go-task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: foundry-rs/foundry-toolchain@v1

      # One fresh univocity contract per forest the suite creates: a contract
      # has exactly one root log. Provisioned in this job rather than a
      # separate one so that every attempt, "Re-run failed jobs" included,
      # deploys its own pool; a pool reused by a second attempt would put a
      # second forest on every contract the first attempt rooted. Pool sizes
      # default in e2e-univocity-provision-pool.sh, beside the inventory;
      # set E2E_UNIVOCITY_POOL_ES256 / _KS256 here to override them. The
      # release assets come from public repos (forestrie/univocity,
      # forestrie/univocity-tools), so GITHUB_TOKEN suffices.
      - name: Provision ephemeral contract pool
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          E2E_UNIVOCITY_RPC_URL: ${{ vars.E2E_UNIVOCITY_RPC_URL }}
          E2E_UNIVOCITY_CONTRACT_POOL_OUT: ${{ runner.temp }}/e2e-univocity-pool.json
          PLAYWRIGHT_PROJECT: ${{ github.event_name == 'push' && 'system' || inputs.playwright_project || 'system' }}
        run: task e2e-univocity:ci-prepare

      - name: System API tests (Playwright)
        env:
          CANOPY_FQDN: ${{ vars.CANOPY_FQDN }}
          SCRAPI_API_KEY: ${{ secrets.SCRAPI_API_KEY }}
          CANOPY_BASE_URL: ${{ vars.CANOPY_BASE_URL }}
          FOREST_PROJECT_ID: ${{ vars.FOREST_PROJECT_ID }}
          CUSTODIAN_URL: ${{ vars.CUSTODIAN_URL }}
          CUSTODIAN_APP_TOKEN: ${{ secrets.CUSTODIAN_APP_TOKEN }}
          CUSTODIAN_BOOTSTRAP_APP_TOKEN: ${{ secrets.CUSTODIAN_BOOTSTRAP_APP_TOKEN }}
          CANOPY_OPS_ADMIN_TOKEN: ${{ secrets.CANOPY_OPS_ADMIN_TOKEN }}
          DELEGATION_COORDINATOR_URL: ${{ vars.DELEGATION_COORDINATOR_URL }}
          COORDINATOR_APP_TOKEN: ${{ secrets.COORDINATOR_APP_TOKEN }}
          UNIVOCITY_SERVICE_URL: ${{ vars.UNIVOCITY_SERVICE_URL }}
          E2E_UNIVOCITY_RPC_URL: ${{ vars.E2E_UNIVOCITY_RPC_URL }}
          E2E_UNIVOCITY_CHAIN_ID: ${{ vars.E2E_UNIVOCITY_CHAIN_ID }}
          # x402 payer: defaults to the already-funded deployer EOA (DEPLOY_KEY
          # holds the lane's Base Sepolia USDC); a dedicated
          # CANOPY_X402_DEV_PRIVATE_KEY wins when set. X402_SETTLEMENT_URL
          # (optional) enables the settled-credits poll.
          #
          # No UNIVOCITY_CONTRACT_ADDRESS: it pinned a long-lived registered
          # instance for credits-purchase.spec.ts, was never set in any canopy
          # environment, and is retired with that spec (FOR-531).
          CANOPY_X402_DEV_PRIVATE_KEY: ${{ secrets.CANOPY_X402_DEV_PRIVATE_KEY || secrets.DEPLOY_KEY }}
          X402_SETTLEMENT_URL: ${{ vars.X402_SETTLEMENT_URL }}
          # Run the BYOK checkpoint seal stretch on the dev lane: it is the
          # only automated guard on the live entry -> sealer -> v3 checkpoint
          # -> receipt path (~25s; caught two live regressions during the
          # FOR-316 cutover). All env it needs is exported above.
          E2E_BYOK_SEAL_STRETCH: ${{ (inputs.environment || 'dev') == 'dev' && '1' || '' }}
          # Passkey (WebAuthn, alg -65800) seal stretch: dev lane only, the
          # standing guard on the sealer's WebAuthn delegation lease verify
          # (arbor#95) and the ADR-0065 offline rung (plan-2608-14 4.1).
          E2E_PASSKEY_SEAL_STRETCH: ${{ (inputs.environment || 'dev') == 'dev' && '1' || '' }}
          # Late-delegation seal-hint latency spec (#224): dev lane only — it
          # needs a coordinator deployed with SEAL_HINT_QUEUE_URL (lane A).
          # Parks the sealer unsigned, submits the certificate late, and
          # requires the receipt within E2E_SEAL_HINT_BUDGET_MS (default 90s).
          E2E_SEAL_HINT_LATENCY: ${{ (inputs.environment || 'dev') == 'dev' && '1' || '' }}
          # Paid register-grant spec (plan-2608-09 W5): dev lane only — it needs
          # canopy-api running REGISTER_GRANT_ADMISSION=paid|either +
          # REGISTER_GRANT_PRICE_ATOMIC (set on lane A in wrangler.jsonc) and a
          # funded Base Sepolia payer (CANOPY_X402_DEV_PRIVATE_KEY / DEPLOY_KEY,
          # already used by the paid onboard/credits specs). Registers a child
          # under the bit-carrying parent, 402s unpaid, succeeds paid, and
          # offline-proves the policy bit from the parent's receipt.
          E2E_GRANT_PAYMENT: ${{ (inputs.environment || 'dev') == 'dev' && '1' || '' }}
          PLAYWRIGHT_PROJECT: ${{ github.event_name == 'push' && 'system' || inputs.playwright_project || 'system' }}
          REQUIRE_COORDINATOR_E2E: ${{ github.event_name == 'push' && 'false' || inputs.require_coordinator_e2e || 'false' }}
        run: |
          set -euo pipefail
          trim_ws() { printf '%s' "$1" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'; }
          if [ -z "$(trim_ws "${SCRAPI_API_KEY:-}")" ]; then
            echo "::error::SCRAPI_API_KEY is not set in GitHub Environment **${{ inputs.environment || 'dev' }}**."
            exit 1
          fi
          BASE="$(trim_ws "${CANOPY_BASE_URL:-}")"
          if [ -n "$BASE" ]; then
            export CANOPY_BASE_URL="${BASE%/}"
          else
            FQ=$(trim_ws "${CANOPY_FQDN:-}")
            FQ="${FQ#https://}"
            FQ="${FQ#http://}"
            FQ="${FQ%%/*}"
            FQ="${FQ%/}"
            if [ -z "$FQ" ]; then
              echo "::error::Set **CANOPY_BASE_URL** or **CANOPY_FQDN** in GitHub Environment **${{ inputs.environment || 'dev' }}**."
              exit 1
            fi
            export CANOPY_BASE_URL="https://${FQ}"
            export CANOPY_BASE_URL="${CANOPY_BASE_URL%/}"
          fi
          export E2E_SKIP_UNIVOCITY_CHAIN_BINDING=false
          if [ "${PLAYWRIGHT_PROJECT}" = "prod" ]; then
            pnpm --filter @canopy/api-e2e exec playwright install chromium
            pnpm --filter @canopy/api-e2e exec playwright test \
              --project=prod \
              --forbid-only
          else
            OPS="$(trim_ws "${CANOPY_OPS_ADMIN_TOKEN:-}")"
            if [ -z "$OPS" ]; then
              echo "::error::CANOPY_OPS_ADMIN_TOKEN is required for bootstrap system e2e (onboard-token genesis)."
              exit 1
            fi
            COORD_URL="$(trim_ws "${DELEGATION_COORDINATOR_URL:-}")"
            COORD_TOKEN="$(trim_ws "${COORDINATOR_APP_TOKEN:-}")"
            task e2e-shared:validate-univocity-deploy
            pnpm --filter @canopy/api-e2e exec playwright install chromium
            pnpm --filter @canopy/api-e2e exec playwright test \
              --project=integration \
              --forbid-only
            pnpm --filter @canopy/api-e2e exec playwright test \
              --project=system \
              --forbid-only
            pnpm --filter @canopy/api-e2e exec playwright test \
              --project=custodian \
              --forbid-only
            if [ -n "$COORD_URL" ] && [ -n "$COORD_TOKEN" ]; then
              pnpm --filter @canopy/api-e2e exec playwright test \
                --project=coordinator \
                --forbid-only
            elif [ "${REQUIRE_COORDINATOR_E2E}" = "true" ]; then
              echo "::error::Coordinator e2e required but DELEGATION_COORDINATOR_URL or COORDINATOR_APP_TOKEN is unset."
              exit 1
            else
              echo "::warning::Skipping coordinator Playwright project."
            fi
          fi

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.event_name == 'push' && 'dev' || inputs.environment }}-${{ github.run_id }}
          path: packages/tests/canopy-api/playwright-report/
          retention-days: 14

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ github.event_name == 'push' && 'dev' || inputs.environment }}-${{ github.run_id }}
          path: packages/tests/canopy-api/test-results/
          retention-days: 14
          if-no-files-found: ignore
